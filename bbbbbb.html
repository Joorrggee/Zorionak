<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Verificador de Palabra</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 50px;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
    }
    #resultado {
      margin-top: 20px;
      font-weight: bold;
    }
    #imagen {
      display: none;
      margin-top: 20px;
      max-width: 100%;
      border: 2px solid #ccc;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h2>Introduce la palabra correcta:</h2>
  <input type="text" id="respuesta" placeholder="Escribe aquí">
  <button onclick="verificar()">Comprobar</button>
  <p id="resultado"></p>
  <img id="imagen" src="tu-imagen.png" alt="Dubrovnik">

  <script>
    function verificar() {
      const entrada = document.getElementById("respuesta").value.trim();
      const resultado = document.getElementById("resultado");
      const imagen = document.getElementById("imagen");

      if (entrada.toLowerCase() === "dubrovnik") {
        resultado.textContent = "¡Correcto!";
        resultado.style.color = "green";
        imagen.style.display = "block";
      } else {
        resultado.textContent = "Incorrecto. Intenta de nuevo.";
        resultado.style.color = "red";
        imagen.style.display = "none";
      }
    }
  </script>
</body>
</html>
